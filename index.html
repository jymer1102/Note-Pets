<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Pets</title>

  <!-- Favicon & Touch Icon -->
  <link rel="icon" type="image/png" href="images/favicon/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon/favicon.png">

  <!-- Social Preview (Open Graph) -->
  <meta property="og:title" content="3D Pet Playground">
  <meta property="og:description" content="Create, customize, and play with your own 3D pets.">
  <meta property="og:image" content="images/favicon/favicon.png">
  <meta property="og:type" content="website">

  <!-- Social Preview (Twitter) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="3D Pet Playground">
  <meta name="twitter:description" content="Create, customize, and play with your own 3D pets.">
  <meta name="twitter:image" content="images/favicon/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- AUTH MODAL -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2><i class="fa-solid fa-paw"></i> Pet Playground</h2>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <div class="input-container">
          <input type="text" id="loginUsername" placeholder="Username">
        </div>
        <div class="input-container">
          <input type="password" id="loginPassword" placeholder="Password">
          <i class="fa-solid fa-eye toggle-password" data-target="loginPassword"></i>
        </div>
        <button class="auth-btn btn-login" id="loginBtn" type="button">Log In</button>
        
        <div class="auth-toggle-container">
          <span>Don't have an account?</span>
          <button class="btn-toggle" id="showSignup" type="button">Register Here</button>
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div id="signupForm" style="display: none;">
        <div class="input-container">
          <input type="text" id="signupUsername" placeholder="Username (min 2 chars)">
          <span id="usernameCheck" class="check-icon"></span>
        </div>
        <div class="input-container">
          <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
          <i class="fa-solid fa-eye toggle-password" data-target="signupPassword"></i>
        </div>
        <div class="input-container">
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">
          <i class="fa-solid fa-eye toggle-password" data-target="signupConfirmPassword"></i>
        </div>
        <button class="auth-btn btn-signup" id="signupBtn" type="button">Sign Up</button>
        
        <div class="auth-toggle-container">
          <span>Already have an account?</span>
          <button class="btn-toggle" id="showLogin" type="button">Log In Here</button>
        </div>
      </div>

      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- TOP CONTROLS -->
  <div class="top-right-controls" id="topControls" style="display: none;">
    <button class="top-btn" id="addPetBtn" type="button"><i class="fa-solid fa-plus"></i> Add Pet</button>
    <button class="top-btn" id="logoutBtn" type="button"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>

  <!-- PET DETAILS CARD -->
  <div class="pet-card" id="petCard">
    <h3>
      <span><i class="fa-solid fa-paw"></i> Pet Details</span>
      <button class="close-btn" id="closeCardBtn" type="button"><i class="fa-solid fa-xmark"></i></button>
    </h3>
    
    <div class="control-group">
      <label for="petColor">Pet Color:</label>
      <input type="color" id="petColor" value="#ff6b81">
    </div>

    <input type="text" id="noteTitle" placeholder="Pet Name / Title...">
    <textarea id="noteInput" placeholder="Add a note for this pet..."></textarea>
    
    <div class="btn-group">
      <button class="btn-save" id="saveNoteBtn" type="button"><i class="fa-solid fa-floppy-disk"></i> Save Pet</button>
      <button class="btn-delete" id="deleteNoteBtn" type="button"><i class="fa-solid fa-trash-can"></i> Delete Pet</button>
    </div>
  </div>

  <!-- Application Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
